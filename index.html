<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one working page for the call. Fields on the left, a plain "enough / not enough" signal and the copy-for-AI button on the right.
   Violet is the interface accent; green and red appear only in the signal. */
:root {
  --bg: #F6F5FA;
  --surface: #FFFFFF;
  --ink: #17151F;
  --muted: #5E5C70;
  --line: #DEDCE8;
  --accent: #5B3FD9;
  --accent-ink: #FFFFFF;
  --accent-soft: #ECE8FC;
  --ok: #17703E;
  --ok-soft: #DDF3E6;
  --warn: #8F5400;
  --warn-soft: #FBEBCB;
  --bad: #B3202E;
  --bad-soft: #FBDDE0;
  --font-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --font-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0D14; --surface: #17161F; --ink: #ECEAF5; --muted: #A3A1B6; --line: #2C2A3A;
    --accent: #A78BFA; --accent-ink: #14111F; --accent-soft: #272241;
    --ok: #62D78E; --ok-soft: #15301F; --warn: #F0B85A; --warn-soft: #35280F;
    --bad: #FF7F8B; --bad-soft: #3A1519;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0D14; --surface: #17161F; --ink: #ECEAF5; --muted: #A3A1B6; --line: #2C2A3A;
  --accent: #A78BFA; --accent-ink: #14111F; --accent-soft: #272241;
  --ok: #62D78E; --ok-soft: #15301F; --warn: #F0B85A; --warn-soft: #35280F;
  --bad: #FF7F8B; --bad-soft: #3A1519;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1260px; margin: 0 auto; }

.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.logo { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }
.brand small { color: var(--muted); font-size: 13px; }
.client { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.client select, .client input { height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px; min-width: 0; }
.client select { max-width: 230px; }
.client input { width: 250px; max-width: 100%; }
.btn { height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger.armed { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13.5px; }
.btn.wide { width: 100%; height: 44px; font-size: 15px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { padding: 10px 14px; background: none; border: none; border-bottom: 2px solid transparent; font-weight: 500; color: var(--muted); white-space: nowrap; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .cnt { font-size: 12px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 1px 7px; margin-left: 6px; font-weight: 600; }
.note { background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; font-size: 14px; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }

/* field groups */
.group { display: flex; flex-direction: column; gap: 10px; }
.group h2 { margin: 10px 0 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.f { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px 10px; display: flex; flex-direction: column; gap: 7px; min-width: 0; position: relative; }
.f.key { border-left: 4px solid var(--accent); }
.f.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.f.asm { border-color: var(--warn); background: var(--warn-soft); }
.f-head { display: flex; align-items: center; gap: 8px; position: relative; min-width: 0; }
.f-label { font-weight: 600; font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; }
.tagb { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 700; color: var(--accent); flex: none; }
.why { margin-left: auto; flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; padding: 0; line-height: 1; }
.why:hover, .why[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.tip { display: none; position: absolute; right: 0; top: 30px; z-index: 5; width: min(300px, 92vw); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
.tip b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .7; margin-bottom: 3px; font-weight: 600; }
.f-head:has(.why:hover) .tip, .f-head:has(.why:focus-visible) .tip, .f-head.tip-open .tip { display: block; }
textarea, .field { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 10px; resize: none; line-height: 1.45; min-width: 0; }
.f.asm textarea { background: var(--surface); }
textarea:focus, .field:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { padding: 2px 9px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.asm-toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; align-self: flex-start; }
.f.asm .asm-toggle { color: var(--warn); font-weight: 600; }

/* summary */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { margin: 0; font-size: 17px; font-weight: 600; }
.asm-item { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.asm-item .lbl { font-weight: 600; font-size: 14px; }
.asm-item textarea { background: var(--surface); }
.agrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.agrid label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.agrid .field { height: 36px; padding: 0 9px; }
.list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); font-size: 14px; }
details.fold { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.fold > summary { cursor: pointer; padding: 13px 16px; font-weight: 600; font-size: 16px; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: '▾'; color: var(--muted); transition: transform .15s; }
details.fold[open] > summary::after { transform: rotate(180deg); }
details.fold .fold-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.preview { min-height: 150px; font-size: 14px; }

/* signal panel */
.side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.signal { border-radius: 10px; padding: 13px 14px; display: flex; flex-direction: column; gap: 4px; border: 1px solid; }
.signal.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.signal.good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.signal b { font-size: 19px; line-height: 1.2; }
.signal span { font-size: 14px; color: var(--ink); }
.must-title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
.must { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.must button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: none; border-radius: 8px; padding: 7px 6px; }
.must button:hover { background: var(--bg); }
.box { flex: none; width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--line); display: inline-block; text-align: center; font-size: 13px; line-height: 16px; font-weight: 700; }
.box.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.box.asm { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.box.none { border-color: var(--bad); }
.must .ml { flex: 1; min-width: 0; font-size: 14.5px; }
.must .ms { flex: none; font-size: 12.5px; color: var(--muted); }
.soft { font-size: 13.5px; color: var(--muted); margin: 0; }
.soft summary { cursor: pointer; }
.soft ul { margin: 6px 0 0; padding-left: 18px; }
.side .hint { font-size: 12.5px; }

.minibar { display: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }

@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; order: -1; }
  .minibar { display: flex; align-items: center; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border: none; border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); width: 100%; text-align: left; }
  .minibar b { font-size: 15px; }
  .minibar.bad b { color: var(--bad); } .minibar.good b { color: var(--ok); }
  .minibar span { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  body { padding-bottom: 76px; }
  .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 720px) {
  .fields, .agrid { grid-template-columns: minmax(0, 1fr); }
  .client input { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo">Бриф-ассистент</span>
      <small>Для Авитолога на созвоне: заполняйте по ходу разговора, чтобы не забыть детали для стратегии</small>
    </div>
    <div class="client">
      <label class="sr" for="client-select">Клиент</label>
      <select id="client-select"></select>
      <label class="sr" for="client-name">Название клиента</label>

      <button class="btn" id="new-client" type="button">+ Клиент</button>
      <button class="btn danger" id="del-client" type="button">Удалить</button>
    </div>
  </header>

  <div class="app">
    <main class="main">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="content"></div>

    <aside class="side" id="side" aria-label="Достаточно ли информации">
      <div class="panel">
        <div class="signal" id="signal" role="status" aria-live="polite">
          <b id="sig-title"></b>
          <span id="sig-sub"></span>
        </div>
        <div>
          <p class="must-title" id="must-title"></p>
          <ul class="must" id="must"></ul>
        </div>
        <details class="soft" id="soft"></details>
      </div>
    </aside>
  </div>
</div>

<button class="minibar bad" id="minibar" type="button" aria-label="Показать, чего не хватает">

</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-in" accept=".json,application/json" hidden>

    S.activeId = S.clients[0].id; ui.view = 'brief'; renderAll(); toast('Клиент удалён');
  });
  $('minibar').addEventListener('click', function () { $('side').scrollIntoView({ behavior: 'smooth', block: 'start' }); });

  $('file-in').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result)), list = d.clients || (d.client ? [d.client] : null);
        if (!Array.isArray(list)) throw new Error('format');
        list.forEach(function (c) {
          if (!c || typeof c !== 'object' || !c.f || typeof c.f !== 'object') return;
          var n = newClient(String(c.name || 'Из файла'));
          Object.keys(c.f).forEach(function (k) {
            if (!FMAP[k] || !c.f[k] || typeof c.f[k] !== 'object') return;
            n.f[k] = { v: String(c.f[k].v || ''), asm: !!c.f[k].asm, src: c.f[k].src, when: c.f[k].when };
          });
          S.clients.push(n); S.activeId = n.id;
        });
        ui.view = 'brief'; renderAll(); toast('Бриф загружен');
      } catch (err) { toast('Не удалось прочитать файл'); }
      e.target.value = '';
    };
    r.readAsText(f);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.querySelectorAll('.f-head.tip-open').forEach(function (n) {
      n.classList.remove('tip-open'); var b = n.querySelector('.why'); if (b) b.setAttribute('aria-expanded', 'false');
    });
  });

  renderAll();

  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (d) { DL = d || null; if (ui.view === 'summary') renderContent(); }, function () { DL = null; });
    }
  } catch (e) { /* capability unavailable */ }
})();
</script>
